<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INCOMING SIGNAL ｜ GOODFUN TEAM</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="GOODFUN TEAM 孤芳小隊">
<link rel="icon" href="../assets/images/logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="../assets/images/logo-192.png">
<meta name="theme-color" content="#a9b79a">
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "40369991a2ed46218ce262e7ed74cbd2"}'></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: the whole screen is one old monochrome LCD — status bar, message body, two soft keys. Single deliberate look. */
:root{
  --lcd:#a9b79a;       /* backlit LCD ground */
  --lcd-hi:#b8c5a8;
  --ink:#1d2a1a;       /* pixel ink */
  --ink-soft:#4a5a42;
  --ghost:rgba(29,42,26,.09);
  --f-pix:"DotGothic16","VT323","Noto Sans TC","PingFang TC",monospace;
  --f-num:"VT323","DotGothic16",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--lcd);color:var(--ink);font-family:var(--f-pix);
  background-image:
    radial-gradient(120% 80% at 50% 0%,var(--lcd-hi),transparent 70%),
    repeating-linear-gradient(0deg,var(--ghost) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,var(--ghost) 0 1px,transparent 1px 3px);
}
.screen{
  min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 18px;gap:18px;
}
/* status bar */
.status{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-num);font-size:22px;line-height:1}
.bars{display:flex;align-items:flex-end;gap:3px;height:18px}
.bars i{display:block;width:5px;background:var(--ink)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:13px}.bars i:nth-child(4){height:18px}
.bars.weak i:nth-child(n+2){background:transparent;outline:1px solid var(--ink-soft);outline-offset:-1px}
.batt{display:flex;align-items:center;gap:2px}
.batt b{display:block;width:26px;height:12px;border:2px solid var(--ink);padding:1px;box-sizing:border-box;display:flex;gap:1px}
.batt b span{flex:1;background:var(--ink)}
.batt em{width:3px;height:6px;background:var(--ink)}
.lang{display:flex;gap:2px}
.lang button{font:inherit;font-size:20px;background:none;border:0;color:var(--ink-soft);padding:2px 6px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--lcd)}
.lang button:focus-visible,.key:focus-visible,.links a:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}

.brand{font-family:var(--f-num);font-size:26px;letter-spacing:.12em;border-bottom:2px solid var(--ink);padding-bottom:6px;display:flex;justify-content:space-between}
.brand small{font-size:20px;letter-spacing:.06em;color:var(--ink-soft)}

main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.log{font-family:var(--f-num);font-size:22px;line-height:1.25;white-space:pre-wrap;min-height:5.2em}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--ink);vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.card{border:2px solid var(--ink);padding:16px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:4px 4px 0 var(--ink)}
.card .id{font-family:var(--f-num);font-size:24px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .id span:last-child{color:var(--ink-soft)}
.mission{font-size:clamp(22px,6vw,28px);line-height:1.5;text-wrap:balance;margin:0}
.sub{font-size:16px;line-height:1.55;color:var(--ink-soft);margin:0}
.count{font-family:var(--f-num);font-size:64px;line-height:1;text-align:center}

.keys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.key{font-family:var(--f-pix);font-size:17px;padding:12px 8px;background:var(--ink);color:var(--lcd);border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.key small{font-family:var(--f-num);font-size:18px;letter-spacing:.1em;opacity:.75}
.key.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.key:active{transform:translate(2px,2px)}
.key[disabled]{opacity:.35;cursor:default}

.links{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.links a{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink);text-decoration:none;border:2px solid var(--ink);padding:12px 12px;font-size:17px}
.links a span:last-child{font-family:var(--f-num);font-size:20px;color:var(--ink-soft);min-width:0;overflow-wrap:anywhere;text-align:right}
.links a:hover{background:var(--ink);color:var(--lcd)}
.links a:hover span:last-child{color:var(--lcd)}

.foot{font-family:var(--f-num);font-size:18px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.flash{animation:flash .35s steps(2) 2}
@keyframes flash{50%{background:var(--ink);color:var(--lcd)}}
@media (prefers-reduced-motion:reduce){.cursor,.flash{animation:none}}
</style>
</head>
<body>

<div class="screen">
  <div class="status" aria-hidden="true">
    <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-zh" data-l="zh">中</button><button id="l-en" data-l="en">EN</button><button id="l-ja" data-l="ja">日</button>
    </div>
    <div class="batt"><b><span></span><span></span><span></span></b><em></em></div>
  </div>
  <div class="brand"><span>ROTION87</span><small>GOODFUN TEAM</small></div>

  <main id="main" aria-live="polite"></main>

  <div class="foot"><span>孤芳小隊</span><span id="clock">--:--</span></div>
</div>

<script>
const IG_ME="https://www.instagram.com/rotion87/";
const IG_TEAM="https://www.instagram.com/goodfun.team/";
const SITE="https://goodfunteam.github.io/HOME/";

const M=[
 {zh:"找到一塊空心磚，跟它說聲辛苦了。",en:"Find a cinder block. Thank it for its service.",ja:"空心ブロックを見つけて、「おつかれさま」と声をかけよう。"},
 {zh:"數一數今天看到幾張「禁止張貼」上面被貼了東西。",en:"Count how many \"No Posting\" signs have something posted on them.",ja:"「貼り紙禁止」の上に何か貼られているのを、今日いくつ見たか数えよう。"},
 {zh:"找一台停在原地很久的機車，猜猜它在等誰。",en:"Find a scooter that hasn't moved in ages. Guess who it's waiting for.",ja:"ずっと動いていないバイクを見つけて、誰を待っているか想像しよう。"},
 {zh:"找到一台被遺忘的投幣搖搖馬，確認它還在原地。",en:"Check on a forgotten coin-ride horse. Make sure it's still there.",ja:"忘れられた乗り物の馬が、まだそこにいるか確かめよう。"},
 {zh:"把手機鈴聲改成最老派的那一個，撐過今天。",en:"Change your ringtone to the oldest one you can find. Survive the day.",ja:"着信音をいちばん古いものに変えて、今日一日を乗り切ろう。"},
 {zh:"傳一則只有「:)」的訊息給很久沒聯絡的人。",en:"Send just \":)\" to someone you haven't talked to in years.",ja:"何年も連絡していない人に「:)」だけ送ろう。"},
 {zh:"不看手機，猜現在幾點，再對答案。",en:"Guess the time without looking. Then check.",ja:"スマホを見ずに今の時刻を当てて、答え合わせしよう。"},
 {zh:"打一通電話，而不是傳訊息。",en:"Make a phone call instead of texting.",ja:"メッセージの代わりに、電話をかけよう。"},
 {zh:"今天第一杯飲料，點一個你從來沒點過的。",en:"Order a drink you've never tried.",ja:"今日の最初の一杯は、頼んだことのないものにしよう。"},
 {zh:"結帳時看著店員的眼睛說聲謝謝。",en:"Look the cashier in the eye and say thanks.",ja:"レジで店員さんの目を見て「ありがとう」と言おう。"},
 {zh:"走一條你從來沒走過的巷子回家。",en:"Walk home through an alley you've never taken.",ja:"通ったことのない路地を歩いて帰ろう。"},
 {zh:"對著天空拍一張照片，什麼濾鏡都不加。",en:"Take one photo of the sky. No filter.",ja:"空の写真を一枚。フィルターなしで。"},
 {zh:"你的任務是：今天準時下班。",en:"Your mission: leave work on time today.",ja:"今日の任務：定時で帰ること。"},
 {zh:"找到另一張這款貼紙。不要告訴任何人。",en:"Find another one of these stickers. Tell no one.",ja:"このステッカーをもう一枚探せ。誰にも言うな。"},
 {zh:"任務已完成：你掃了這個 QR code。",en:"Mission complete: you scanned this code.",ja:"任務完了：あなたはこのコードをスキャンした。"},
 {zh:"此訊息將在 5 秒後自動銷毀。",en:"This message will self-destruct in 5 seconds.",ja:"このメッセージは5秒後に自動消滅する。",boom:true}
];

const T={
 zh:{boot:["CONNECTING...","SEARCHING SIGNAL...","SIGNAL FOUND","INCOMING TRANSMISSION"],mission:"MISSION",from:"FROM: GOODFUN HQ",
     rescan:"換一個任務",report:"回報任務完成",reporting:["SENDING REPORT...","UPLOADING...","REPORT RECEIVED"],
     done:"幹得好，特務。",doneSub:"總部已收到你的回報。完成任務拍照標記我們，總部會看到。",
     hq:"總部聯絡方式",site:"官網",again:"接收新任務",boomLeft:"秒後銷毀",gone:"訊息已銷毀。"},
 en:{boot:["CONNECTING...","SEARCHING SIGNAL...","SIGNAL FOUND","INCOMING TRANSMISSION"],mission:"MISSION",from:"FROM: GOODFUN HQ",
     rescan:"Too hard. Next.",report:"Report complete",reporting:["SENDING REPORT...","UPLOADING...","REPORT RECEIVED"],
     done:"Well done, agent.",doneSub:"HQ got your report. Snap your mission and tag us — HQ is watching.",
     hq:"Contact HQ",site:"Website",again:"Receive new mission",boomLeft:"sec to self-destruct",gone:"Message destroyed."},
 ja:{boot:["CONNECTING...","SEARCHING SIGNAL...","SIGNAL FOUND","INCOMING TRANSMISSION"],mission:"MISSION",from:"FROM: GOODFUN HQ",
     rescan:"別の任務にする",report:"任務完了を報告",reporting:["SENDING REPORT...","UPLOADING...","REPORT RECEIVED"],
     done:"よくやった、エージェント。",doneSub:"本部は報告を受け取った。任務の写真を撮って、私たちをタグ付けしよう。",
     hq:"本部の連絡先",site:"公式サイト",again:"新しい任務を受信",boomLeft:"秒後に消滅",gone:"メッセージは消滅した。"}
};

let lang=(()=>{try{return localStorage.getItem("gf-lang")}catch(e){return null}})()
  || ((navigator.language||"").startsWith("ja")?"ja":(navigator.language||"").startsWith("zh")?"zh":"en");
let cur=-1, view="boot", timer=null, typing=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $main=document.getElementById("main");
const pad=n=>String(n).padStart(3,"0");

function setLang(l){
  lang=l;try{localStorage.setItem("gf-lang",l)}catch(e){}
  document.documentElement.lang={zh:"zh-Hant",en:"en",ja:"ja"}[l];
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  if(view==="mission")showMission(false);else if(view==="hq")showHQ(false);
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

function typeLines(lines,done){
  clearTimeout(typing);
  $main.innerHTML='<div class="log" id="log"></div>';
  const log=document.getElementById("log");
  if(reduce){log.textContent=lines.join("\n");typing=setTimeout(done,400);return}
  let li=0,ci=0,out="";
  (function step(){
    if(li>=lines.length){log.innerHTML=out+'<span class="cursor"></span>';typing=setTimeout(done,500);return}
    const line=lines[li];
    if(ci<line.length){out+=line[ci++];log.innerHTML=out+'<span class="cursor"></span>';typing=setTimeout(step,28)}
    else{out+="\n";li++;ci=0;typing=setTimeout(step,260)}
  })();
}

function pick(){let n;do{n=Math.floor(Math.random()*M.length)}while(n===cur&&M.length>1);cur=n}

function showMission(fresh=true){
  view="mission";clearInterval(timer);
  if(fresh)pick();
  const t=T[lang],m=M[cur];
  $main.innerHTML=`
    <div class="card${fresh?" flash":""}">
      <div class="id"><span>${t.mission} #${pad(cur+1)}</span><span>${t.from}</span></div>
      <p class="mission" id="mtext">${m[lang]}</p>
      <div id="boom"></div>
    </div>
    <div class="keys">
      <button class="key ghost" id="k-rescan"><span>${t.rescan}</span><small>RE-SCAN</small></button>
      <button class="key" id="k-report"><span>${t.report}</span><small>REPORT</small></button>
    </div>`;
  document.getElementById("k-rescan").onclick=rescan;
  document.getElementById("k-report").onclick=report;
  if(m.boom&&fresh)selfDestruct();
}

function selfDestruct(){
  let s=5;const box=document.getElementById("boom");
  const draw=()=>box.innerHTML=`<div class="count">${s}</div><p class="sub" style="text-align:center">${T[lang].boomLeft}</p>`;
  draw();
  timer=setInterval(()=>{s--;if(s>0){draw();return}
    clearInterval(timer);
    document.getElementById("mtext").textContent=T[lang].gone;
    box.innerHTML="";document.getElementById("k-report").disabled=true;
    setTimeout(()=>{if(view==="mission"&&M[cur].boom)rescan()},1600);
  },1000);
}

function rescan(){
  clearInterval(timer);view="boot";
  document.getElementById("bars").classList.add("weak");
  typeLines(["RE-SCANNING...","SIGNAL FOUND"],()=>{document.getElementById("bars").classList.remove("weak");showMission()});
}

function report(){
  clearInterval(timer);view="boot";
  typeLines(T[lang].reporting,()=>showHQ());
}

function showHQ(fresh=true){
  view="hq";const t=T[lang];
  $main.innerHTML=`
    <div class="card${fresh?" flash":""}">
      <div class="id"><span>REPORT #${pad(cur+1)} ✓</span><span>${t.from}</span></div>
      <p class="mission">${t.done}</p>
      <p class="sub">${t.doneSub}</p>
    </div>
    <p class="sub" style="font-family:var(--f-num);font-size:20px;color:var(--ink)">&gt; ${t.hq}</p>
    <ul class="links">
      <li><a href="${SITE}" target="_blank" rel="noopener"><span>${t.site}</span><span>GOODFUN TEAM</span></a></li>
      <li><a href="${IG_ME}" target="_blank" rel="noopener"><span>Instagram</span><span>@rotion87</span></a></li>
      <li><a href="${IG_TEAM}" target="_blank" rel="noopener"><span>Instagram</span><span>@goodfun.team</span></a></li>
    </ul>
    <div class="keys" style="grid-template-columns:1fr">
      <button class="key" id="k-again"><span>${t.again}</span><small>NEW SIGNAL</small></button>
    </div>`;
  document.getElementById("k-again").onclick=rescan;
}

function tick(){const d=new Date();document.getElementById("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
tick();setInterval(tick,15000);

setLang(lang);
document.getElementById("bars").classList.add("weak");
typeLines(T[lang].boot,()=>{document.getElementById("bars").classList.remove("weak");showMission()});
</script>

</body>
</html>
